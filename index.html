<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Goksha — Home</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{
      font-family: system-ui, Arial;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      margin:0;
      background:#e8f7ff;
    }
    .box{
      padding:30px;
      max-width:600px;
      text-align:center;
      background:white;
      border-radius:12px;
      box-shadow:0 4px 20px rgba(0,0,0,0.1);
    }
    h1{
      margin:0;
      font-size:28px;
      color:#0077cc;
      font-weight:700;
    }
    p{color:#333;margin:10px 0 20px;}
    a.btn{
      display:inline-block;
      padding:12px 20px;
      margin:8px;
      border-radius:50px;
      text-decoration:none;
      font-weight:600;
      color:white;
    }
    .farmer{background:#0077cc;}
    .buyer{background:#00aaff;}
  </style>
</head>
<body>
  <div class="box">
    <h1>Welcome to Goksha</h1>
    <p>Select your portal</p>
    
    <a class="btn farmer" href="farmer.html">Farmer Portal</a>
    <a class="btn buyer" href="buyer.html">Buyer Portal</a>
  </div>
  <p class="help-text">
  Are you a hotel / restaurant? 
  <a href="buyer.html">Go to Buyer Portal</a>
</p>

</body>
</html>
